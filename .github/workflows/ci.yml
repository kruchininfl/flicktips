# Checks for the v2 workspace (apps/*, packages/*): lint, typecheck, tests, build.
# Runs on pull requests and pushes to master_v2; it never deploys.
name: CI

on:
  pull_request:
    branches: [master_v2]
  push:
    branches: [master_v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
