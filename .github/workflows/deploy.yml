# Production deploy: runs tools/deploy.sh on a GitHub runner instead of a dev Mac.
# Images are built here for linux/amd64 and pushed to Docker Hub; the server only pulls
# them (see docker/deploy.sh). Manual only (Actions → Deploy → Run workflow): pick
# services or leave empty for all, or roll back.
#
# Secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DOCKERHUB_TOKEN; optional DEPLOY_HOST,
# DEPLOY_PATH (defaults live in tools/deploy.sh).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild, space-separated (web api kp-parser ft-parser tg-bot nginx); empty = all'
        required: false
        default: ''
      rollback:
        description: 'Roll back to PREV_TAG instead of deploying'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.rollback }}

      # Exposes the cache service token to tools/deploy.sh for --cache-to type=gha.
      - uses: crazy-max/ghaction-github-runtime@v3
        if: ${{ !inputs.rollback }}

      - uses: docker/login-action@v3
        if: ${{ !inputs.rollback }}
        with:
          username: infamoustill
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        if: ${{ !inputs.rollback }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BUILDX_CACHE: gha
          SERVICES: ${{ inputs.services }}
        # $SERVICES is split on spaces on purpose; deploy.sh rejects unknown names.
        run: tools/deploy.sh $SERVICES

      - name: Roll back
        if: ${{ inputs.rollback }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: tools/deploy.sh --rollback
