; Bind PHP-FPM to loopback only: containers share the host network,
; so nginx reaches it on 127.0.0.1:9000 and it is not exposed publicly.
[global]
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
