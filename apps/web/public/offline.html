<!doctype html>
<!-- Offline fallback of the service worker (src/sw/sw.ts): a static file, the same for every visitor, so it never
     holds anyone's data. Self-contained: no network is available when it is shown. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="robots" content="noindex" />
    <title>Нет соединения — FlickTips</title>
    <link rel="icon" href="/public/favicon-32x32.png" sizes="32x32" type="image/png" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        box-sizing: border-box;
        background: #0d0e12;
        color: #f2f0ec;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .logo em {
        font-style: normal;
        color: #ffb446;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #9a978f;
      }
      button {
        margin-top: 24px;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: #ffb446;
        color: #0d0e12;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Flick<em>Tips</em></div>
      <h1>Нет соединения с интернетом</h1>
      <p>Страница откроется, когда связь появится.</p>
      <button type="button" id="retry">Обновить</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
