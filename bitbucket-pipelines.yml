image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 2048
  caches:
    web: web/node_modules
    kp: kp-parser/node_modules
    ft: ft-parser/node_modules
  steps:
    - step: &check-web
        name: Check web build
        image: node:16
        caches:
          - web
        script:
          - cd web
          - npm ci
          - npm run build
    - step: &check-api
        name: Check api composer install
        image: composer:2
        script:
          - cd api
          - composer install --no-dev --no-scripts --no-interaction --prefer-dist
    - step: &check-kp
        name: Check kp-parser
        image: node:16
        caches:
          - kp
        script:
          - cd kp-parser
          - npm ci
    - step: &check-ft
        name: Check ft-parser typecheck
        image: node:16
        caches:
          - ft
        script:
          - cd ft-parser
          - yarn install --frozen-lockfile
          - npx tsc --noEmit
    - step: &build-push
        name: Build and push images
        services:
          - docker
        script:
          - export TAG="${BITBUCKET_COMMIT}"
          - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          - REPO="docker.io/$DOCKERHUB_USER"
          - |
              for pair in \
                "web:./web" \
                "kp-parser:./kp-parser" \
                "ft-parser:./ft-parser" \
                "nginx:./nginx" \
                "api:${BITBUCKET_CLONE_DIR}"; do
                name="${pair%%:*}"
                context="${pair#*:}"
                if [ "$name" = "api" ]; then
                  docker build -t "$REPO/flicktips-$name:$TAG" -t "$REPO/flicktips-$name:latest" -f api/Dockerfile "$context"
                else
                  docker build -t "$REPO/flicktips-$name:$TAG" -t "$REPO/flicktips-$name:latest" "$context"
                fi
                docker push "$REPO/flicktips-$name:$TAG"
                docker push "$REPO/flicktips-$name:latest"
              done
    - step: &deploy
        name: Deploy to production
        deployment: production
        script:
          - apt-get update -qq && apt-get install -y -qq rsync
          - mkdir -p ~/.ssh
          - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          - echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          - export SSH_OPTS="-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          - export TAG="${BITBUCKET_COMMIT}"
          - rsync -az --delete --exclude '.git' --exclude 'node_modules' --exclude 'data' -e "ssh $SSH_OPTS" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          - ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && DOCKERHUB_USER='$DOCKERHUB_USER' DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' TAG='$TAG' bash docker/deploy.sh"

pipelines:
  default:
    - step: *check-kp
    - step: *check-ft
    - step: *check-api
    - step: *check-web
  branches:
    master:
      - step: *check-kp
      - step: *check-ft
      - step: *check-api
      - step: *check-web
      - step: *build-push
      - step: *deploy
