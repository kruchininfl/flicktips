# Production compose for FlickTips.
#
# All services use network_mode: host so they can reach the host's MySQL
# (127.0.0.1:3306), the host's Tor/proxy, and each other on loopback.
# Images are built locally and shipped over SSH by tools/deploy.sh (no registry);
# the active tag is stored as TAG in the server's .env.
#
#   docker/deploy.sh up <tag>      # on the server

services:
  web:
    image: infamoustill/flicktips-web:${TAG:-latest}
    build:
      context: ./web
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: infamoustill/flicktips-api:${TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      PHP_FPM_LISTEN: "127.0.0.1:9000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kp-parser:
    image: infamoustill/flicktips-kp-parser:${TAG:-latest}
    build:
      context: ./kp-parser
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ft-parser:
    image: infamoustill/flicktips-ft-parser:${TAG:-latest}
    build:
      context: ./ft-parser
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: infamoustill/flicktips-nginx:${TAG:-latest}
    build:
      context: ./nginx
    network_mode: host
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
