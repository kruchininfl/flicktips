# Production compose for FlickTips.
#
# All services use network_mode: host so they can reach the host's MySQL
# (127.0.0.1:3306), the host's Tor/proxy, and each other on loopback.
# Images are built and pushed by Bitbucket Pipelines; the server only pulls.
#
#   docker compose pull && docker compose up -d
#
# For local image builds (docker compose build) set DOCKERHUB_USER and DOCKERHUB_REPO.

services:
  web:
    image: docker.io/${DOCKERHUB_USER:-flicktips}/flicktips-web:${TAG:-latest}
    build:
      context: ./web
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: docker.io/${DOCKERHUB_USER:-flicktips}/flicktips-api:${TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      PHP_FPM_LISTEN: "127.0.0.1:9000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kp-parser:
    image: docker.io/${DOCKERHUB_USER:-flicktips}/flicktips-kp-parser:${TAG:-latest}
    build:
      context: ./kp-parser
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ft-parser:
    image: docker.io/${DOCKERHUB_USER:-flicktips}/flicktips-ft-parser:${TAG:-latest}
    build:
      context: ./ft-parser
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: docker.io/${DOCKERHUB_USER:-flicktips}/flicktips-nginx:${TAG:-latest}
    build:
      context: ./nginx
    network_mode: host
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
