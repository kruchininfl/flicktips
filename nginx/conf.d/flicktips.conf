# FlickTips web SSR (:3001) + PHP-FPM API (:9000) behind a single origin.
# Containers use network_mode: host, so upstreams are reached on 127.0.0.1.
# The API front controller lives in the api container; nginx only forwards
# FastCGI with an absolute SCRIPT_FILENAME (resolved inside that container).
upstream flicktips_web {
    server 127.0.0.1:3001;
}

upstream flicktips_api {
    server 127.0.0.1:9000;
}

# Movie posters from Кинопоиск (see location /poster/kp/). The server disk is nearly full, so
# the cache is capped; it lives in the container and starts empty after a redeploy.
proxy_cache_path /var/cache/nginx/posters levels=1:2 keys_zone=posters:10m max_size=1g
                 inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name flicktips.ru www.flicktips.ru;

    access_log /var/log/nginx/flicktips.access.log;
    error_log  /var/log/nginx/flicktips.error.log;

    # ACME challenge for certbot --webroot (must stay on :80 for renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name 45.15.252.159;

    access_log /var/log/nginx/tg-brew.access.log;
    error_log  /var/log/nginx/tg-brew.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server. Certificate issued by certbot (see docker/certbot-init.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name flicktips.ru www.flicktips.ru;

    ssl_certificate     /etc/letsencrypt/live/flicktips.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flicktips.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/flicktips.access.log;
    error_log  /var/log/nginx/flicktips.error.log;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api {
        include fastcgi_params;
        fastcgi_pass flicktips_api;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SCRIPT_FILENAME /var/www/api/web/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/web;
        fastcgi_param HTTPS on;
    }

    # OAuth login/callback/check routes are registered by the Silex API
    # (see api/app/services.php), so they must reach PHP-FPM, not the web SSR.
    location /auth {
        include fastcgi_params;
        fastcgi_pass flicktips_api;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SCRIPT_FILENAME /var/www/api/web/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/web;
        fastcgi_param HTTPS on;
    }

    # Posters by kp_id, fetched from Кинопоиск and cached here: image.tmdb.org is often
    # unreachable from Russia. ?tmdb=<poster_path> is the fallback when Кинопоиск has no
    # poster or is down (see getPosterUrl in web/src/helpers.js).
    location ~ ^/poster/kp/(\d+)\.jpg$ {
        set $kp_poster_id $1;
        # a variable in proxy_pass resolves at request time, so a DNS hiccup can't stop nginx
        resolver 77.88.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://kinopoiskapiunofficial.tech/images/posters/kp_small/$kp_poster_id.jpg;
        proxy_ssl_server_name on;
        proxy_set_header Host kinopoiskapiunofficial.tech;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache posters;
        proxy_cache_key $kp_poster_id;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Poster-Cache $upstream_cache_status;
        expires 30d;

        proxy_intercept_errors on;
        error_page 403 404 500 502 503 504 = @poster_tmdb;
    }

    location @poster_tmdb {
        # only a bare TMDb file name, so this can't be used as an open redirect
        if ($arg_tmdb ~ "^/[A-Za-z0-9_-]+\.(jpg|png)$") {
            return 302 https://image.tmdb.org/t/p/w342$arg_tmdb;
        }
        return 404;
    }

    location /public/ {
        proxy_pass http://flicktips_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://flicktips_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
