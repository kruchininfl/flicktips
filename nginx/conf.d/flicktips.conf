# FlickTips web SSR (:3001) + PHP-FPM API (:9000) behind a single origin.
# Containers use network_mode: host, so upstreams are reached on 127.0.0.1.
# The API front controller lives in the api container; nginx only forwards
# FastCGI with an absolute SCRIPT_FILENAME (resolved inside that container).
upstream flicktips_web {
    server 127.0.0.1:3001;
}

upstream flicktips_api {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name flicktips.ru www.flicktips.ru;

    access_log /var/log/nginx/flicktips.access.log;
    error_log  /var/log/nginx/flicktips.error.log;

    # ACME challenge for certbot --webroot (must stay on :80 for renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name 45.15.252.159;

    access_log /var/log/nginx/tg-brew.access.log;
    error_log  /var/log/nginx/tg-brew.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server. Certificate issued by certbot (see docker/certbot-init.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name flicktips.ru www.flicktips.ru;

    ssl_certificate     /etc/letsencrypt/live/flicktips.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flicktips.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/flicktips.access.log;
    error_log  /var/log/nginx/flicktips.error.log;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api {
        include fastcgi_params;
        fastcgi_pass flicktips_api;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SCRIPT_FILENAME /var/www/api/web/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/web;
        fastcgi_param HTTPS on;
    }

    location /public/ {
        proxy_pass http://flicktips_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://flicktips_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
